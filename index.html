<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ed">
  <title>Chatbot</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f4ed;
      --surface: #fffdf8;
      --surface-soft: #ece7dc;
      --ink: #2f3430;
      --muted: #6d736a;
      --line: #ddd6c9;
      --accent: #6c8065;
      --accent-strong: #52664d;
      --clay: #b46f56;
      --shadow: 0 18px 55px rgba(58, 52, 42, .13);
      --radius: 8px;
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: var(--font);
      background:
        linear-gradient(120deg, rgba(108, 128, 101, .12), transparent 32%),
        linear-gradient(300deg, rgba(180, 111, 86, .12), transparent 38%),
        var(--paper);
      color: var(--ink);
      letter-spacing: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
    }

    button, textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .58;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100svh;
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
      gap: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      padding: 0 4px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .avatar {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: linear-gradient(145deg, #6c8065, #9d8f72);
      color: #fffdf8;
      box-shadow: 0 12px 28px rgba(82, 102, 77, .24);
    }

    .avatar svg {
      width: 25px;
      height: 25px;
    }

    .name {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.1;
      font-weight: 750;
      letter-spacing: 0;
    }

    .role {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .94rem;
      line-height: 1.45;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: min(62vw, 560px);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      color: var(--muted);
      background: rgba(255, 253, 248, .72);
      border: 1px solid rgba(221, 214, 201, .9);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: .9rem;
      backdrop-filter: blur(18px);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(108, 128, 101, .14);
    }

    .chat-shell {
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr;
      background: rgba(255, 253, 248, .78);
      border: 1px solid rgba(221, 214, 201, .9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(22px);
    }

    .messages {
      min-height: 0;
      overflow-y: auto;
      padding: 28px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 10px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #d4cbbb;
      border: 3px solid transparent;
      background-clip: content-box;
      border-radius: 999px;
    }

    .day-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 2px 0 22px;
      color: var(--muted);
      font-size: .82rem;
    }

    .day-divider::before,
    .day-divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .message-row {
      display: flex;
      margin: 14px 0;
      animation: enter .2s ease-out both;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .bubble {
      width: fit-content;
      max-width: min(74ch, 78%);
      border-radius: var(--radius);
      padding: 13px 15px 11px;
      line-height: 1.75;
      font-size: 1rem;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .bot .bubble {
      background: #ffffff;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .user .bubble {
      background: var(--accent);
      color: #fffdf8;
      box-shadow: 0 10px 28px rgba(82, 102, 77, .18);
    }

    .meta {
      display: block;
      margin-top: 8px;
      font-size: .76rem;
      line-height: 1.2;
      color: var(--muted);
    }

    .user .meta {
      color: rgba(255, 253, 248, .78);
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 54px;
      height: 26px;
    }

    .typing i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1s ease-in-out infinite;
    }

    .typing i:nth-child(2) {
      animation-delay: .16s;
    }

    .typing i:nth-child(3) {
      animation-delay: .32s;
    }

    .composer-wrap {
      padding: 0 24px 24px;
    }

    .composer {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: end;
      gap: 10px;
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px;
      background: rgba(255, 253, 248, .88);
      border: 1px solid rgba(221, 214, 201, .96);
      border-radius: var(--radius);
      box-shadow: 0 18px 45px rgba(58, 52, 42, .12);
      backdrop-filter: blur(22px);
    }

    .icon-button,
    .send-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      transition: transform .16s ease, background .16s ease, color .16s ease, box-shadow .16s ease;
    }

    .icon-button {
      background: #f0ebe1;
      color: var(--ink);
    }

    .icon-button.active {
      background: #f7e7df;
      color: var(--clay);
      box-shadow: 0 0 0 3px rgba(180, 111, 86, .12);
    }

    .send-button {
      background: var(--accent);
      color: #fffdf8;
    }

    .icon-button:hover,
    .send-button:hover {
      transform: translateY(-1px);
    }

    .send-button:hover {
      background: var(--accent-strong);
    }

    .icon-button svg,
    .send-button svg {
      width: 21px;
      height: 21px;
      stroke-width: 2;
    }

    .input {
      width: 100%;
      min-height: 44px;
      max-height: 150px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      padding: 10px 2px 6px;
      line-height: 1.6;
      font-size: 1rem;
    }

    .input::placeholder {
      color: #8a8c83;
    }

    .notice {
      display: none;
      margin: 10px auto 0;
      max-width: 1120px;
      color: #7e4b3d;
      font-size: .88rem;
      line-height: 1.5;
    }

    .notice.show {
      display: block;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 80%, 100% {
        opacity: .32;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (max-width: 720px) {
      .app {
        padding: 16px 12px 12px;
        gap: 12px;
      }

      .topbar {
        min-height: 64px;
      }

      .status {
        display: none;
      }

      .avatar {
        width: 44px;
        height: 44px;
      }

      .name {
        font-size: 1.22rem;
      }

      .role {
        max-width: 70vw;
        font-size: .86rem;
      }

      .messages {
        padding: 20px 14px;
      }

      .bubble {
        max-width: 88%;
        font-size: .98rem;
      }

      .composer-wrap {
        padding: 0 0 env(safe-area-inset-bottom);
      }

      .composer {
        grid-template-columns: 42px 1fr 42px;
        gap: 8px;
        padding: 10px;
      }

      .icon-button,
      .send-button {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Chatbot 對話頁面">
    <header class="topbar">
      <section class="identity" aria-label="聊天機器人資訊">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 8V4"></path>
            <path d="M8 4h8"></path>
            <rect x="4" y="8" width="16" height="12" rx="4"></rect>
            <path d="M8.5 13h.01"></path>
            <path d="M15.5 13h.01"></path>
            <path d="M9 16c1.6 1 4.4 1 6 0"></path>
          </svg>
        </div>
        <div>
          <h1 class="name">Chatbot</h1>
          <p class="role">開朗、溫柔，陪你把問題聊清楚</p>
        </div>
      </section>
      <aside class="status" aria-label="連線狀態">
        <span class="dot" aria-hidden="true"></span>
        <span id="connectionText">已準備好</span>
      </aside>
    </header>

    <section class="chat-shell">
      <div id="messages" class="messages" aria-live="polite" aria-label="對話紀錄"></div>
    </section>

    <footer class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off">
        <button id="micButton" class="icon-button" type="button" aria-label="語音輸入" title="語音輸入">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <path d="M12 19v3"></path>
          </svg>
        </button>
        <textarea id="messageInput" class="input" rows="1" placeholder="輸入想和 Chatbot 說的話" aria-label="輸入訊息"></textarea>
        <button id="sendButton" class="send-button" type="submit" aria-label="送出訊息" title="送出訊息">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="m22 2-7 20-4-9-9-4Z"></path>
            <path d="M22 2 11 13"></path>
          </svg>
        </button>
      </form>
      <p id="notice" class="notice" role="status"></p>
    </footer>
  </main>

  <script>
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbwT7-BNJE3XOer9fQIGG3Mzv4xCgiWKq9QDevKUPOYh0QVRyP1O7RTGp0aTmlGSmh2u9g/exec";
    const MODEL = "gpt-5.4-mini";
    const SPREADSHEET_ID = "1TolZAXCCD2OUZiStX1X-qWTZfohtDLKABqz-MxFjHEY";
    const STORAGE_KEY = "chatbot-conversation-id";
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    const elements = {
      messages: document.querySelector("#messages"),
      form: document.querySelector("#composer"),
      input: document.querySelector("#messageInput"),
      send: document.querySelector("#sendButton"),
      mic: document.querySelector("#micButton"),
      notice: document.querySelector("#notice"),
      connection: document.querySelector("#connectionText")
    };

    const state = {
      busy: false,
      history: [],
      recognition: null,
      listening: false,
      conversationId: getConversationId()
    };

    const persona = [
      "你是 Chatbot，一位個性開朗、幽默、善於安慰人的聊天機器人。",
      "你熟悉各種學科知識，也擅長用清楚、耐心、循序漸進的方式教學。",
      "你的回答要溫和、正式、自然、有陪伴感，可以適度逗人笑。",
      "不要使用 Markdown 格式，不要輸出列表符號語法，不要使用測試稿語氣。"
    ].join("\n");

    boot();

    function boot() {
      renderDivider(new Date());
      addMessage("bot", "你好，我是 Chatbot。今天想聊心情、學科問題，或只是找個人陪你說說話，都可以交給我。", new Date());
      bindEvents();
      setupSpeech();
      autosize();
    }

    function bindEvents() {
      elements.form.addEventListener("submit", event => {
        event.preventDefault();
        sendCurrentMessage();
      });

      elements.input.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendCurrentMessage();
        }
      });

      elements.input.addEventListener("input", autosize);
      elements.mic.addEventListener("click", toggleSpeech);
    }

    function setupSpeech() {
      if (!SpeechRecognition) {
        elements.mic.disabled = true;
        elements.mic.title = "這個瀏覽器目前不支援語音輸入";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "zh-TW";
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = () => {
        state.listening = true;
        elements.mic.classList.add("active");
        setNotice("正在聆聽你的聲音。");
      };

      recognition.onend = () => {
        state.listening = false;
        elements.mic.classList.remove("active");
        hideNotice();
      };

      recognition.onerror = () => {
        state.listening = false;
        elements.mic.classList.remove("active");
        setNotice("語音輸入暫時無法啟用，請改用鍵盤輸入。");
      };

      recognition.onresult = event => {
        let text = "";
        for (let i = event.resultIndex; i < event.results.length; i += 1) {
          text += event.results[i][0].transcript;
        }
        elements.input.value = text.trim();
        autosize();
      };

      state.recognition = recognition;
    }

    function toggleSpeech() {
      if (!state.recognition || state.busy) return;
      if (state.listening) {
        state.recognition.stop();
      } else {
        state.recognition.start();
      }
    }

    async function sendCurrentMessage() {
      const text = elements.input.value.trim();
      if (!text || state.busy) return;

      const sentAt = new Date();
      elements.input.value = "";
      autosize();
      hideNotice();
      addMessage("user", text, sentAt);
      state.history.push({ role: "user", content: text, timestamp: sentAt.toISOString() });
      setBusy(true);

      const typingNode = addTyping();

      try {
        const reply = await askChatbot(text, sentAt);
        typingNode.remove();
        const cleanReply = normalizeReply(reply);
        const repliedAt = new Date();
        addMessage("bot", cleanReply, repliedAt);
        state.history.push({ role: "assistant", content: cleanReply, timestamp: repliedAt.toISOString() });
      } catch (error) {
        typingNode.remove();
        addMessage("bot", "我這邊暫時連不上後台，但你的訊息我已經收到。請稍後再試一次，我會在這裡等你。", new Date());
        setNotice("後台連線暫時不穩，請確認 GAS Web App 已部署並允許存取。");
      } finally {
        setBusy(false);
      }
    }

    function askChatbot(message, sentAt) {
      const payload = {
        model: MODEL,
        spreadsheetId: SPREADSHEET_ID,
        conversationId: state.conversationId,
        persona,
        message,
        timestamp: formatTimestamp(sentAt),
        history: state.history.slice(-12)
      };

      if (window.google && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(response => resolve(readReply(response)))
            .withFailureHandler(reject)
            .handleChat(payload);
        });
      }

      return fetch(GAS_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
        .then(response => {
          if (!response.ok) throw new Error("Network response was not ok");
          return response.json();
        })
        .then(readReply);
    }

    function readReply(response) {
      if (typeof response === "string") return response;
      if (response && typeof response.reply === "string") return response.reply;
      if (response && typeof response.message === "string") return response.message;
      if (response && typeof response.text === "string") return response.text;
      return "我在，請再多告訴我一點，我會陪你慢慢整理。";
    }

    function addMessage(role, text, date) {
      const row = document.createElement("div");
      row.className = `message-row ${role === "user" ? "user" : "bot"}`;

      const bubble = document.createElement("article");
      bubble.className = "bubble";

      const content = document.createElement("div");
      content.textContent = text;

      const meta = document.createElement("time");
      meta.className = "meta";
      meta.dateTime = date.toISOString();
      meta.textContent = formatTimestamp(date);

      bubble.append(content, meta);
      row.appendChild(bubble);
      elements.messages.appendChild(row);
      scrollToBottom();
      return row;
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "message-row bot";
      row.innerHTML = '<article class="bubble"><span class="typing" aria-label="Chatbot 正在回覆"><i></i><i></i><i></i></span></article>';
      elements.messages.appendChild(row);
      scrollToBottom();
      return row;
    }

    function renderDivider(date) {
      const divider = document.createElement("div");
      divider.className = "day-divider";
      divider.textContent = date.toLocaleDateString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "long"
      });
      elements.messages.appendChild(divider);
    }

    function normalizeReply(text) {
      return String(text || "")
        .replace(/```[\s\S]*?```/g, block => block.replace(/```/g, ""))
        .replace(/[*_#>`~]/g, "")
        .replace(/\[(.*?)\]\((.*?)\)/g, "$1")
        .trim() || "我在，請再多告訴我一點。";
    }

    function formatTimestamp(date) {
      const value = date instanceof Date ? date : new Date(date);
      return value.toLocaleString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
    }

    function setBusy(isBusy) {
      state.busy = isBusy;
      elements.send.disabled = isBusy;
      elements.input.disabled = isBusy;
      elements.connection.textContent = isBusy ? "正在回覆" : "已準備好";
      if (!isBusy) elements.input.focus();
    }

    function setNotice(text) {
      elements.notice.textContent = text;
      elements.notice.classList.add("show");
    }

    function hideNotice() {
      elements.notice.classList.remove("show");
      elements.notice.textContent = "";
    }

    function autosize() {
      elements.input.style.height = "auto";
      elements.input.style.height = `${Math.min(elements.input.scrollHeight, 150)}px`;
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        elements.messages.scrollTop = elements.messages.scrollHeight;
      });
    }

    function getConversationId() {
      const existing = localStorage.getItem(STORAGE_KEY);
      if (existing) return existing;
      const id = `chatbot-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      localStorage.setItem(STORAGE_KEY, id);
      return id;
    }
  </script>
</body>
</html>
